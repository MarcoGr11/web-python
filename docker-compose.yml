# One file for both environments: DJANGO_ENV (sandbox|production, default
# sandbox) picks the env file and the compose project name, so each
# environment gets its own containers and its own postgres_data volume.
#   docker compose up --build                       -> sandbox
#   DJANGO_ENV=production docker compose up --build -> production
name: galactic-auction-${DJANGO_ENV:-sandbox}

services:
  postgres:
    networks: [backend]
    image: postgres:16-alpine
    restart: unless-stopped
    env_file:
      - .env.${DJANGO_ENV:-sandbox}
    # Published on loopback only: pytest/Locust on the host need it, the LAN doesn't.
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    networks: [backend]
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # One-shot init container: applies migrations and (sandbox only) seeds
  # demo data with well-known passwords, then exits. Kept separate from `web`
  # so N replicas starting at once never race on migrate/seed: it runs exactly
  # once and every replica waits for it (service_completed_successfully).
  migrate:
    networks: [backend]
    build: .
    env_file:
      - .env.${DJANGO_ENV:-sandbox}
    environment:
      POSTGRES_HOST: postgres
      REDIS_HOST: redis
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: >
      sh -c "python manage.py migrate --noinput &&
             if [ \"$$DJANGO_ENV\" = sandbox ]; then python manage.py seed; fi"
    restart: "no"

  # Identical stateless replicas: sessions live in postgres, the channel layer
  # in redis, SECRET_KEY comes from the same env file. No host port — replicas
  # can't share one; nginx is the only entry point.
  #   docker compose up --build --scale web=1   -> override the replica count
  web:
    networks: [backend]
    build: .
    deploy:
      replicas: 3
    env_file:
      - .env.${DJANGO_ENV:-sandbox}
    environment:
      POSTGRES_HOST: postgres
      REDIS_HOST: redis
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    command: daphne -b 0.0.0.0 -p 8000 config.asgi:application
    restart: unless-stopped
    # No curl in the slim image, so probe the home page with the stdlib.
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # Single entry point: load-balances HTTP and WebSocket across web replicas.
  nginx:
    networks: [backend]
    image: nginx:1.28-alpine
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx:/etc/nginx/conf.d:ro
    depends_on:
      web:
        condition: service_healthy

networks:
  backend:

volumes:
  postgres_data:
