{% extends "auctions/base.html" %}
{% block content %}
<div class="card">
    <h1>Login</h1>
    {% if form.errors %}<p class="error">Invalid username or password.</p>{% endif %}
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Login</button>
    </form>
</div>
{% endblock %}
