<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Galactic Artifact Auction{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-start: #05061c;
            --bg-mid: #10082c;
            --bg-end: #1a1040;
            --accent: #8a4dff;
            --accent-2: #29e0e0;
            --card: rgba(255, 255, 255, 0.05);
            --border: rgba(255, 255, 255, 0.12);
            --text: #eae7fb;
            --muted: #a29fc4;
        }
        * { box-sizing: border-box; }
        html, body { height: 100%; }
        body {
            margin: 0;
            font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
            color: var(--text);
            background: linear-gradient(160deg, var(--bg-start) 0%, var(--bg-mid) 45%, var(--bg-end) 100%) fixed;
            min-height: 100vh;
            position: relative;
        }
        /* Lightweight static star field — pure CSS, no images/libraries. */
        body::before {
            content: "";
            position: fixed;
            inset: 0;
            z-index: -2;
            background-repeat: repeat;
            background-size: 220px 220px;
            background-image:
                radial-gradient(1.5px 1.5px at 20px 30px, #fff, transparent),
                radial-gradient(1px 1px at 60px 90px, #fff, transparent),
                radial-gradient(1.5px 1.5px at 110px 40px, #fff, transparent),
                radial-gradient(1px 1px at 150px 130px, #fff, transparent),
                radial-gradient(1.5px 1.5px at 190px 70px, #fff, transparent),
                radial-gradient(1px 1px at 40px 170px, #fff, transparent);
            opacity: 0.55;
        }
        h1, h2, h3, .brand {
            font-family: "Orbitron", "Inter", sans-serif;
            letter-spacing: 0.02em;
        }
        header {
            background: rgba(10, 6, 30, 0.55);
            backdrop-filter: blur(8px);
            border-bottom: 1px solid var(--border);
            padding: 0.85rem 1.5rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 0.5rem;
            position: sticky;
            top: 0;
            z-index: 10;
        }
        header .brand {
            font-weight: 700;
            font-size: 1.1rem;
            color: var(--text);
            text-decoration: none;
            text-shadow: 0 0 10px rgba(138, 77, 255, 0.7), 0 0 20px rgba(41, 224, 224, 0.35);
            animation: brand-glow 4s ease-in-out infinite;
        }
        @keyframes brand-glow {
            0%, 100% { text-shadow: 0 0 8px rgba(138, 77, 255, 0.55), 0 0 16px rgba(41, 224, 224, 0.25); }
            50% { text-shadow: 0 0 16px rgba(138, 77, 255, 0.9), 0 0 28px rgba(41, 224, 224, 0.55); }
        }
        nav a, nav button {
            color: var(--accent-2);
            text-decoration: none;
            margin-left: 1rem;
            font-size: 0.95rem;
            transition: text-shadow 0.2s ease, color 0.2s ease;
        }
        nav a:hover, nav button:hover {
            color: #fff;
            text-shadow: 0 0 8px var(--accent-2);
        }
        nav .role-badge {
            font-size: 0.8rem;
            color: var(--muted);
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid var(--border);
            border-radius: 999px;
            padding: 0.15rem 0.7rem;
        }
        button, input[type="submit"] {
            cursor: pointer;
            background: linear-gradient(135deg, var(--accent), var(--accent-2));
            color: #08061a;
            font-weight: 600;
            border: none;
            border-radius: 8px;
            padding: 0.55rem 1.1rem;
            font-size: 0.95rem;
            transition: box-shadow 0.2s ease, transform 0.2s ease;
        }
        button:hover, input[type="submit"]:hover {
            box-shadow: 0 0 16px rgba(138, 77, 255, 0.7), 0 0 28px rgba(41, 224, 224, 0.35);
            transform: translateY(-1px);
        }
        nav button {
            background: none;
            color: var(--accent-2);
            font-weight: 400;
            padding: 0;
            margin-left: 1rem;
            text-decoration: underline;
        }
        nav button:hover { box-shadow: none; transform: none; }
        main {
            max-width: 760px;
            margin: 2rem auto;
            padding: 0 1.5rem 3rem;
            position: relative;
            z-index: 1;
        }
        .card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 1.6rem;
            backdrop-filter: blur(12px);
            box-shadow: 0 0 40px rgba(138, 77, 255, 0.08);
        }
        h1 { margin-top: 0; }
        ul.plain { list-style: none; padding: 0; }
        ul.plain li {
            padding: 0.7rem 0;
            border-bottom: 1px solid var(--border);
        }
        ul.plain li:last-child { border-bottom: none; }
        ul.plain a { color: var(--accent-2); text-decoration: none; }
        ul.plain a:hover { text-shadow: 0 0 8px var(--accent-2); }
        form p { margin: 0.75rem 0; }
        input:not([type="submit"]), textarea {
            width: 100%;
            padding: 0.55rem;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text);
            font-size: 0.95rem;
        }
        input:focus, textarea:focus {
            outline: none;
            border-color: var(--accent-2);
            box-shadow: 0 0 0 2px rgba(41, 224, 224, 0.25);
        }
        label { font-size: 0.9rem; color: var(--muted); }
        .error { color: #ff6b8b; }
        .muted { color: var(--muted); }

        #starfield {
            position: fixed;
            inset: 0;
            z-index: -1;
            pointer-events: none;
            display: block;
        }

        /* Bid amount flash — triggered via JS when a new bid_accepted event arrives. */
        .bid-flash { animation: bid-flash 0.5s ease; }
        @keyframes bid-flash {
            0% { text-shadow: 0 0 0 transparent; transform: scale(1); }
            30% { text-shadow: 0 0 14px var(--accent-2), 0 0 28px var(--accent); transform: scale(1.15); color: var(--accent-2); }
            100% { text-shadow: 0 0 0 transparent; transform: scale(1); }
        }

        /* Cockpit-style countdown timer. */
        .countdown {
            font-family: "Orbitron", sans-serif;
            font-size: 1.15rem;
            letter-spacing: 0.05em;
        }
        .countdown-urgent {
            color: #ff6b8b;
            animation: countdown-blink 1s step-start infinite;
        }
        @keyframes countdown-blink { 50% { opacity: 0.3; } }
        .countdown-closed { color: var(--muted); }

        /* Landing page: hero, button links, lot preview grid, how-it-works steps. */
        .hero { text-align: center; padding: 1.5rem 0 0.5rem; }
        .hero .tagline {
            color: var(--muted);
            max-width: 540px;
            margin: 0.5rem auto 1.5rem;
        }
        .hero-actions {
            display: flex;
            gap: 1rem;
            justify-content: center;
            flex-wrap: wrap;
            margin-bottom: 1rem;
        }
        .btn {
            display: inline-block;
            background: linear-gradient(135deg, var(--accent), var(--accent-2));
            color: #08061a;
            font-weight: 600;
            padding: 0.6rem 1.3rem;
            border-radius: 8px;
            text-decoration: none;
            transition: box-shadow 0.2s ease, transform 0.2s ease;
        }
        .btn:hover {
            box-shadow: 0 0 16px rgba(138, 77, 255, 0.7), 0 0 28px rgba(41, 224, 224, 0.35);
            transform: translateY(-1px);
        }
        .btn-outline {
            background: none;
            border: 1px solid var(--border);
            color: var(--text);
        }
        .btn-outline:hover {
            border-color: var(--accent-2);
            box-shadow: 0 0 12px rgba(41, 224, 224, 0.3);
        }
        .lot-grid, .steps {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 1rem;
            margin: 1rem 0;
        }
        a.lot-card {
            display: block;
            color: inherit;
            text-decoration: none;
        }
        a.lot-card:hover {
            box-shadow: 0 0 30px rgba(41, 224, 224, 0.15);
        }
        .lot-card h3 { margin: 0 0 0.5rem; font-size: 1rem; }
        .step { text-align: center; }
        .step .step-num {
            font-family: "Orbitron", sans-serif;
            font-size: 1.4rem;
            color: var(--accent-2);
            margin-bottom: 0.4rem;
        }

        @media (prefers-reduced-motion: reduce) {
            header .brand { animation: none; }
            button, input[type="submit"], nav a, nav button, .btn {
                transition: none;
            }
            .bid-flash { animation: none; }
            .countdown-urgent { animation: none; }
        }
    </style>
</head>
<body>
    <canvas id="starfield" aria-hidden="true"></canvas>
    <header>
        <a class="brand" href="{% url 'home' %}">🪐 Galactic Artifact Auction</a>
        <nav>
            {% if user.is_authenticated %}
                <span class="role-badge">{{ user.username }} · {% if user.is_staff %}admin{% else %}user{% endif %}</span>
                <a href="{% url 'lot_list' %}">Lots</a>
                <a href="{% url 'dashboard_user' %}">My dashboard</a>
                {% if user.is_staff %}<a href="{% url 'dashboard_admin' %}">Admin dashboard</a>{% endif %}
                <form action="{% url 'logout' %}" method="post" style="display:inline">
                    {% csrf_token %}<button type="submit">Logout</button>
                </form>
            {% else %}
                <a href="{% url 'login' %}">Login</a>
                <a href="{% url 'register' %}">Register</a>
            {% endif %}
        </nav>
    </header>
    <main>
        {% block content %}{% endblock %}
    </main>
    <script>
        (function () {
            const canvas = document.getElementById("starfield");
            if (!canvas || !canvas.getContext) return;
            const ctx = canvas.getContext("2d");
            const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
            let width, height, stars;
            let activeEvent = null;
            let eventInProgress = false;

            function resize() {
                width = canvas.width = window.innerWidth;
                height = canvas.height = window.innerHeight;
            }

            function makeStars() {
                const count = Math.min(60, Math.max(30, Math.floor(width / 28)));
                stars = Array.from({ length: count }, () => ({
                    x: Math.random() * width,
                    y: Math.random() * height,
                    r: Math.random() * 1.3 + 0.4,
                    baseAlpha: Math.random() * 0.5 + 0.3,
                    speed: Math.random() * 0.002 + 0.0006,
                    phase: Math.random() * Math.PI * 2,
                }));
            }

            // --- Ambient background events -------------------------------------
            // Each factory returns { duration, update(time) -> finished, draw(ctx) }.
            // update() computes this.t (0..1 progress) from the first frame's
            // timestamp; draw() only reads that state, so re-entrancy is safe.

            function makeComet() {
                const margin = 40;
                const edge = Math.floor(Math.random() * 4);
                let x0, y0;
                if (edge === 0) { x0 = -margin; y0 = Math.random() * height * 0.6; }
                else if (edge === 1) { x0 = width + margin; y0 = Math.random() * height * 0.6; }
                else if (edge === 2) { x0 = Math.random() * width; y0 = -margin; }
                else { x0 = Math.random() * width; y0 = height + margin; }
                const x1 = width - x0 + (Math.random() - 0.5) * width * 0.3;
                const y1 = height - y0 + (Math.random() - 0.5) * height * 0.3;

                return {
                    duration: 2000 + Math.random() * 1000,
                    start: null,
                    x: x0,
                    y: y0,
                    update(time) {
                        if (this.start === null) this.start = time;
                        const t = Math.min(1, (time - this.start) / this.duration);
                        this.x = x0 + (x1 - x0) * t;
                        this.y = y0 + (y1 - y0) * t;
                        return t >= 1;
                    },
                    draw(ctx2) {
                        const dx = x1 - x0, dy = y1 - y0;
                        const len = Math.hypot(dx, dy) || 1;
                        const ux = dx / len, uy = dy / len;
                        const trail = 60;
                        const tailX = this.x - ux * trail;
                        const tailY = this.y - uy * trail;
                        const grad = ctx2.createLinearGradient(this.x, this.y, tailX, tailY);
                        grad.addColorStop(0, "rgba(255, 255, 255, 0.9)");
                        grad.addColorStop(1, "rgba(255, 255, 255, 0)");
                        ctx2.strokeStyle = grad;
                        ctx2.lineWidth = 2;
                        ctx2.beginPath();
                        ctx2.moveTo(this.x, this.y);
                        ctx2.lineTo(tailX, tailY);
                        ctx2.stroke();
                        ctx2.beginPath();
                        ctx2.fillStyle = "#fff";
                        ctx2.arc(this.x, this.y, 2.2, 0, Math.PI * 2);
                        ctx2.fill();
                    },
                };
            }

            function makeShip() {
                const dir = Math.random() < 0.5 ? 1 : -1;
                const y = 60 + Math.random() * Math.max(1, height - 120);
                const x0 = dir === 1 ? -40 : width + 40;
                const x1 = dir === 1 ? width + 40 : -40;
                const size = 10;

                return {
                    duration: 4000 + Math.random() * 1000,
                    start: null,
                    x: x0,
                    y,
                    time: 0,
                    update(time) {
                        if (this.start === null) this.start = time;
                        const t = Math.min(1, (time - this.start) / this.duration);
                        this.x = x0 + (x1 - x0) * t;
                        this.time = time;
                        return t >= 1;
                    },
                    draw(ctx2) {
                        ctx2.save();
                        ctx2.translate(this.x, this.y);
                        ctx2.scale(dir, 1);
                        ctx2.fillStyle = "rgba(220, 220, 255, 0.85)";
                        ctx2.beginPath();
                        ctx2.moveTo(size, 0);
                        ctx2.lineTo(-size, -size * 0.5);
                        ctx2.lineTo(-size * 0.6, 0);
                        ctx2.lineTo(-size, size * 0.5);
                        ctx2.closePath();
                        ctx2.fill();
                        for (let i = 0; i < 3; i++) {
                            const flicker = 0.3 + 0.5 * Math.abs(Math.sin(this.time * 0.01 + i));
                            ctx2.beginPath();
                            ctx2.fillStyle = `rgba(138, 200, 255, ${flicker * 0.6})`;
                            ctx2.arc(-size - i * 5, (i % 2 === 0 ? 1 : -1) * 1.5, 1.4, 0, Math.PI * 2);
                            ctx2.fill();
                        }
                        ctx2.restore();
                    },
                };
            }

            function makeSupernova() {
                const x = 60 + Math.random() * Math.max(1, width - 120);
                const y = 60 + Math.random() * Math.max(1, height - 120);
                const particles = Array.from({ length: 14 }, () => ({
                    angle: Math.random() * Math.PI * 2,
                    speed: 40 + Math.random() * 60,
                }));

                return {
                    duration: 1500 + Math.random() * 500,
                    start: null,
                    t: 0,
                    update(time) {
                        if (this.start === null) this.start = time;
                        this.t = Math.min(1, (time - this.start) / this.duration);
                        return this.t >= 1;
                    },
                    draw(ctx2) {
                        const t = this.t;
                        const coreRadius = 18 * Math.sin(Math.min(t * 2, 1) * (Math.PI / 2));
                        const alpha = Math.max(0, 1 - t);
                        ctx2.save();
                        ctx2.globalAlpha = alpha;
                        const grad = ctx2.createRadialGradient(x, y, 0, x, y, coreRadius + 6);
                        grad.addColorStop(0, "rgba(255, 255, 255, 1)");
                        grad.addColorStop(0.4, "rgba(180, 150, 255, 0.8)");
                        grad.addColorStop(1, "rgba(180, 150, 255, 0)");
                        ctx2.fillStyle = grad;
                        ctx2.beginPath();
                        ctx2.arc(x, y, coreRadius + 6, 0, Math.PI * 2);
                        ctx2.fill();
                        for (const p of particles) {
                            const dist = p.speed * t * 1.4;
                            ctx2.beginPath();
                            ctx2.fillStyle = `rgba(255, 255, 255, ${alpha})`;
                            ctx2.arc(x + Math.cos(p.angle) * dist, y + Math.sin(p.angle) * dist, 1.6, 0, Math.PI * 2);
                            ctx2.fill();
                        }
                        ctx2.restore();
                    },
                };
            }

            function makeBlackHole() {
                const x = 80 + Math.random() * Math.max(1, width - 160);
                const y = 80 + Math.random() * Math.max(1, height - 160);
                const radius = 16 + Math.random() * 6;
                const maxPull = 40;
                // ponytail: snapshots star refs by identity; a resize mid-event
                // regenerates `stars` and silently orphans this list — fine for
                // a rare cosmetic effect, not worth guarding against.
                const affected = stars
                    .map((s) => ({ star: s, d: Math.hypot(s.x - x, s.y - y), ox: s.x, oy: s.y }))
                    .filter((e) => e.d > radius && e.d < 160)
                    .sort((a, b) => a.d - b.d)
                    .slice(0, 6);

                return {
                    duration: 3000 + Math.random() * 1000,
                    start: null,
                    t: 0,
                    update(time) {
                        if (this.start === null) this.start = time;
                        this.t = Math.min(1, (time - this.start) / this.duration);
                        const pull = this.t < 0.5 ? this.t / 0.5 : (1 - this.t) / 0.5;
                        for (const a of affected) {
                            const dx = x - a.ox, dy = y - a.oy;
                            const dist = Math.hypot(dx, dy) || 1;
                            const frac = Math.min(maxPull / dist, 0.6) * pull;
                            a.star.x = a.ox + dx * frac;
                            a.star.y = a.oy + dy * frac;
                        }
                        if (this.t >= 1) {
                            for (const a of affected) {
                                a.star.x = a.ox;
                                a.star.y = a.oy;
                            }
                            return true;
                        }
                        return false;
                    },
                    draw(ctx2) {
                        const t = this.t;
                        const fade = t < 0.15 ? t / 0.15 : t > 0.85 ? (1 - t) / 0.15 : 1;
                        ctx2.save();
                        ctx2.globalAlpha = Math.max(0, Math.min(1, fade));
                        ctx2.beginPath();
                        ctx2.fillStyle = "#000";
                        ctx2.arc(x, y, radius, 0, Math.PI * 2);
                        ctx2.fill();
                        ctx2.strokeStyle = "rgba(255, 210, 140, 0.85)";
                        ctx2.lineWidth = 2;
                        ctx2.beginPath();
                        ctx2.ellipse(x, y, radius * 1.8, radius * 0.6, Math.PI / 6, 0, Math.PI * 2);
                        ctx2.stroke();
                        ctx2.restore();
                    },
                };
            }

            function scheduleNextEvent() {
                if (reduceMotion) return;
                const delay = 8000 + Math.random() * 7000; // 8-15s
                setTimeout(() => {
                    if (eventInProgress) {
                        scheduleNextEvent();
                        return;
                    }
                    const factories = [makeComet, makeShip, makeSupernova, makeBlackHole];
                    const factory = factories[Math.floor(Math.random() * factories.length)];
                    activeEvent = factory();
                    eventInProgress = true;
                }, delay);
            }

            function draw(time) {
                ctx.clearRect(0, 0, width, height);
                for (const s of stars) {
                    const alpha = reduceMotion
                        ? s.baseAlpha
                        : s.baseAlpha + Math.sin(time * s.speed + s.phase) * 0.35;
                    ctx.beginPath();
                    ctx.fillStyle = `rgba(255, 255, 255, ${Math.max(0, Math.min(1, alpha))})`;
                    ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
                    ctx.fill();
                }

                if (activeEvent) {
                    const finished = activeEvent.update(time);
                    activeEvent.draw(ctx);
                    if (finished) {
                        activeEvent = null;
                        eventInProgress = false;
                        scheduleNextEvent();
                    }
                }

                if (!reduceMotion) requestAnimationFrame(draw);
            }

            resize();
            makeStars();
            window.addEventListener("resize", () => {
                resize();
                makeStars();
            });

            if (reduceMotion) {
                draw(0);
            } else {
                requestAnimationFrame(draw);
                scheduleNextEvent();
            }
        })();
    </script>
</body>
</html>
