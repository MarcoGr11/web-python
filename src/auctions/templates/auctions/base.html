<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Galactic Artifact Auction{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-start: #05061c;
            --bg-mid: #10082c;
            --bg-end: #1a1040;
            --accent: #8a4dff;
            --accent-2: #29e0e0;
            --card: rgba(255, 255, 255, 0.05);
            --border: rgba(255, 255, 255, 0.12);
            --text: #eae7fb;
            --muted: #a29fc4;
        }
        * { box-sizing: border-box; }
        html, body { height: 100%; }
        body {
            margin: 0;
            font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
            color: var(--text);
            background: linear-gradient(160deg, var(--bg-start) 0%, var(--bg-mid) 45%, var(--bg-end) 100%) fixed;
            min-height: 100vh;
            position: relative;
        }
        /* Lightweight static star field — pure CSS, no images/libraries. */
        body::before {
            content: "";
            position: fixed;
            inset: 0;
            z-index: -2;
            background-repeat: repeat;
            background-size: 220px 220px;
            background-image:
                radial-gradient(1.5px 1.5px at 20px 30px, #fff, transparent),
                radial-gradient(1px 1px at 60px 90px, #fff, transparent),
                radial-gradient(1.5px 1.5px at 110px 40px, #fff, transparent),
                radial-gradient(1px 1px at 150px 130px, #fff, transparent),
                radial-gradient(1.5px 1.5px at 190px 70px, #fff, transparent),
                radial-gradient(1px 1px at 40px 170px, #fff, transparent);
            opacity: 0.55;
        }
        h1, h2, h3, .brand {
            font-family: "Orbitron", "Inter", sans-serif;
            letter-spacing: 0.02em;
        }
        header {
            background: rgba(10, 6, 30, 0.55);
            backdrop-filter: blur(8px);
            border-bottom: 1px solid var(--border);
            padding: 0.85rem 1.5rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 0.5rem;
            position: sticky;
            top: 0;
            z-index: 10;
        }
        header .brand {
            font-weight: 700;
            font-size: 1.1rem;
            color: var(--text);
            text-shadow: 0 0 10px rgba(138, 77, 255, 0.7), 0 0 20px rgba(41, 224, 224, 0.35);
            animation: brand-glow 4s ease-in-out infinite;
        }
        @keyframes brand-glow {
            0%, 100% { text-shadow: 0 0 8px rgba(138, 77, 255, 0.55), 0 0 16px rgba(41, 224, 224, 0.25); }
            50% { text-shadow: 0 0 16px rgba(138, 77, 255, 0.9), 0 0 28px rgba(41, 224, 224, 0.55); }
        }
        nav a, nav button {
            color: var(--accent-2);
            text-decoration: none;
            margin-left: 1rem;
            font-size: 0.95rem;
            transition: text-shadow 0.2s ease, color 0.2s ease;
        }
        nav a:hover, nav button:hover {
            color: #fff;
            text-shadow: 0 0 8px var(--accent-2);
        }
        nav .role-badge {
            font-size: 0.8rem;
            color: var(--muted);
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid var(--border);
            border-radius: 999px;
            padding: 0.15rem 0.7rem;
        }
        button, input[type="submit"] {
            cursor: pointer;
            background: linear-gradient(135deg, var(--accent), var(--accent-2));
            color: #08061a;
            font-weight: 600;
            border: none;
            border-radius: 8px;
            padding: 0.55rem 1.1rem;
            font-size: 0.95rem;
            transition: box-shadow 0.2s ease, transform 0.2s ease;
        }
        button:hover, input[type="submit"]:hover {
            box-shadow: 0 0 16px rgba(138, 77, 255, 0.7), 0 0 28px rgba(41, 224, 224, 0.35);
            transform: translateY(-1px);
        }
        nav button {
            background: none;
            color: var(--accent-2);
            font-weight: 400;
            padding: 0;
            margin-left: 1rem;
            text-decoration: underline;
        }
        nav button:hover { box-shadow: none; transform: none; }
        main {
            max-width: 760px;
            margin: 2rem auto;
            padding: 0 1.5rem 3rem;
            position: relative;
            z-index: 1;
        }
        .card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 1.6rem;
            backdrop-filter: blur(12px);
            box-shadow: 0 0 40px rgba(138, 77, 255, 0.08);
        }
        h1 { margin-top: 0; }
        ul.plain { list-style: none; padding: 0; }
        ul.plain li {
            padding: 0.7rem 0;
            border-bottom: 1px solid var(--border);
        }
        ul.plain li:last-child { border-bottom: none; }
        ul.plain a { color: var(--accent-2); text-decoration: none; }
        ul.plain a:hover { text-shadow: 0 0 8px var(--accent-2); }
        form p { margin: 0.75rem 0; }
        input:not([type="submit"]), textarea {
            width: 100%;
            padding: 0.55rem;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text);
            font-size: 0.95rem;
        }
        input:focus, textarea:focus {
            outline: none;
            border-color: var(--accent-2);
            box-shadow: 0 0 0 2px rgba(41, 224, 224, 0.25);
        }
        label { font-size: 0.9rem; color: var(--muted); }
        .error { color: #ff6b8b; }
        .muted { color: var(--muted); }

        #starfield {
            position: fixed;
            inset: 0;
            z-index: -1;
            pointer-events: none;
            display: block;
        }

        /* Bid amount flash — triggered via JS when a new bid_accepted event arrives. */
        .bid-flash { animation: bid-flash 0.5s ease; }
        @keyframes bid-flash {
            0% { text-shadow: 0 0 0 transparent; transform: scale(1); }
            30% { text-shadow: 0 0 14px var(--accent-2), 0 0 28px var(--accent); transform: scale(1.15); color: var(--accent-2); }
            100% { text-shadow: 0 0 0 transparent; transform: scale(1); }
        }

        /* Cockpit-style countdown timer. */
        .countdown {
            font-family: "Orbitron", sans-serif;
            font-size: 1.15rem;
            letter-spacing: 0.05em;
        }
        .countdown-urgent {
            color: #ff6b8b;
            animation: countdown-blink 1s step-start infinite;
        }
        @keyframes countdown-blink { 50% { opacity: 0.3; } }
        .countdown-closed { color: var(--muted); }

        @media (prefers-reduced-motion: reduce) {
            header .brand { animation: none; }
            button, input[type="submit"], nav a, nav button {
                transition: none;
            }
            .bid-flash { animation: none; }
            .countdown-urgent { animation: none; }
        }
    </style>
</head>
<body>
    <canvas id="starfield" aria-hidden="true"></canvas>
    <header>
        <span class="brand">🪐 Galactic Artifact Auction</span>
        <nav>
            {% if user.is_authenticated %}
                <span class="role-badge">{{ user.username }} · {% if user.is_staff %}admin{% else %}user{% endif %}</span>
                <a href="{% url 'lot_list' %}">Lots</a>
                <a href="{% url 'dashboard_user' %}">My dashboard</a>
                {% if user.is_staff %}<a href="{% url 'dashboard_admin' %}">Admin dashboard</a>{% endif %}
                <form action="{% url 'logout' %}" method="post" style="display:inline">
                    {% csrf_token %}<button type="submit">Logout</button>
                </form>
            {% else %}
                <a href="{% url 'login' %}">Login</a>
                <a href="{% url 'register' %}">Register</a>
            {% endif %}
        </nav>
    </header>
    <main>
        {% block content %}{% endblock %}
    </main>
    <script>
        (function () {
            const canvas = document.getElementById("starfield");
            if (!canvas || !canvas.getContext) return;
            const ctx = canvas.getContext("2d");
            const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
            let width, height, stars;

            function resize() {
                width = canvas.width = window.innerWidth;
                height = canvas.height = window.innerHeight;
            }

            function makeStars() {
                const count = Math.min(60, Math.max(30, Math.floor(width / 28)));
                stars = Array.from({ length: count }, () => ({
                    x: Math.random() * width,
                    y: Math.random() * height,
                    r: Math.random() * 1.3 + 0.4,
                    baseAlpha: Math.random() * 0.5 + 0.3,
                    speed: Math.random() * 0.002 + 0.0006,
                    phase: Math.random() * Math.PI * 2,
                }));
            }

            function draw(time) {
                ctx.clearRect(0, 0, width, height);
                for (const s of stars) {
                    const alpha = reduceMotion
                        ? s.baseAlpha
                        : s.baseAlpha + Math.sin(time * s.speed + s.phase) * 0.35;
                    ctx.beginPath();
                    ctx.fillStyle = `rgba(255, 255, 255, ${Math.max(0, Math.min(1, alpha))})`;
                    ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
                    ctx.fill();
                }
                if (!reduceMotion) requestAnimationFrame(draw);
            }

            resize();
            makeStars();
            window.addEventListener("resize", () => {
                resize();
                makeStars();
            });

            if (reduceMotion) {
                draw(0);
            } else {
                requestAnimationFrame(draw);
            }
        })();
    </script>
</body>
</html>
