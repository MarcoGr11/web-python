<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Galactic Artifact Auction{% endblock %}</title>
    <style>
        :root {
            --accent: #5b3df5;
            --bg: #f7f7fb;
            --card: #ffffff;
            --border: #e2e2ec;
            --text: #1c1c28;
            --muted: #6b6b7b;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
            background: var(--bg);
            color: var(--text);
        }
        header {
            background: var(--card);
            border-bottom: 1px solid var(--border);
            padding: 0.75rem 1.5rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 0.5rem;
        }
        header .brand { font-weight: 600; }
        nav a, nav button {
            color: var(--accent);
            text-decoration: none;
            margin-left: 1rem;
            font-size: 0.95rem;
        }
        nav .role-badge {
            font-size: 0.8rem;
            color: var(--muted);
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 999px;
            padding: 0.1rem 0.6rem;
        }
        button, input[type="submit"] {
            cursor: pointer;
            background: var(--accent);
            color: #fff;
            border: none;
            border-radius: 6px;
            padding: 0.5rem 1rem;
            font-size: 0.95rem;
        }
        nav button {
            background: none;
            color: var(--accent);
            padding: 0;
            margin-left: 1rem;
            text-decoration: underline;
        }
        main {
            max-width: 720px;
            margin: 2rem auto;
            padding: 0 1.5rem 3rem;
        }
        .card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 1.5rem;
        }
        h1 { margin-top: 0; }
        ul.plain { list-style: none; padding: 0; }
        ul.plain li {
            padding: 0.6rem 0;
            border-bottom: 1px solid var(--border);
        }
        ul.plain li:last-child { border-bottom: none; }
        form p { margin: 0.75rem 0; }
        input:not([type="submit"]), textarea {
            width: 100%;
            padding: 0.5rem;
            border: 1px solid var(--border);
            border-radius: 6px;
            font-size: 0.95rem;
        }
        label { font-size: 0.9rem; color: var(--muted); }
        .error { color: #c0392b; }
        .muted { color: var(--muted); }
    </style>
</head>
<body>
    <header>
        <span class="brand">🛰️ Galactic Artifact Auction</span>
        <nav>
            {% if user.is_authenticated %}
                <span class="role-badge">{{ user.username }} · {% if user.is_staff %}admin{% else %}user{% endif %}</span>
                <a href="{% url 'lot_list' %}">Lots</a>
                <a href="{% url 'dashboard_user' %}">My dashboard</a>
                {% if user.is_staff %}<a href="{% url 'dashboard_admin' %}">Admin dashboard</a>{% endif %}
                <form action="{% url 'logout' %}" method="post" style="display:inline">
                    {% csrf_token %}<button type="submit">Logout</button>
                </form>
            {% else %}
                <a href="{% url 'login' %}">Login</a>
                <a href="{% url 'register' %}">Register</a>
            {% endif %}
        </nav>
    </header>
    <main>
        {% block content %}{% endblock %}
    </main>
</body>
</html>
