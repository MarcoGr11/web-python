<svg width="680" height="430" viewBox="0 0 680 430" xmlns="http://www.w3.org/2000/svg" role="img" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>Архітектура Galactic Artifact Auction</title>
<desc>Клієнти підключаються через WebSocket до Django Channels сервера, який обробляє ставки через AuctionConsumer з блокуванням select_for_update, записує їх у PostgreSQL і розсилає оновлення всім клієнтам через Redis.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>

<rect width="680" height="430" fill="#ffffff"/>

<g>
<rect x="60" y="30" width="170" height="44" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="145" y="52" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#2C2C2A">Клієнт A (браузер)</text>
</g>
<g>
<rect x="450" y="30" width="170" height="44" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="535" y="52" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#2C2C2A">Клієнт B (браузер)</text>
</g>

<line x1="145" y1="74" x2="145" y2="108" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="535" y1="74" x2="535" y2="108" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

<g>
<rect x="100" y="110" width="480" height="140" rx="16" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text x="340" y="132" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#3C3489">Django + Channels (ASGI сервер)</text>
<text x="340" y="150" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#534AB7">Приймає ставки через WebSocket</text>
</g>
<g>
<rect x="140" y="165" width="400" height="64" rx="10" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
<text x="340" y="189" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#712B13">AuctionConsumer</text>
<text x="340" y="211" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#993C1D">select_for_update() блокує рядок лота</text>
</g>

<line x1="220" y1="250" x2="195" y2="298" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="460" y1="250" x2="485" y2="298" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

<g>
<rect x="80" y="300" width="230" height="70" rx="12" fill="#EAF3DE" stroke="#3B6D11" stroke-width="0.5"/>
<text x="195" y="326" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#27500A">PostgreSQL</text>
<text x="195" y="348" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#3B6D11">Lot, Bid — джерело істини</text>
</g>
<g>
<rect x="380" y="300" width="220" height="70" rx="12" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="490" y="326" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#085041">Redis</text>
<text x="490" y="348" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#0F6E56">Кеш та pub/sub канали</text>
</g>

<path d="M600,320 C648,320 648,74 622,74" fill="none" stroke="#5F5E5A" stroke-width="0.5" stroke-dasharray="4 3" marker-end="url(#arrow)"/>

<text x="340" y="404" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#5F5E5A">Пунктирна лінія — розсилка оновлення ставки всім підключеним клієнтам через Redis</text>
</svg>
