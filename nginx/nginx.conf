# Mounted as /etc/nginx/conf.d/ (http context of the stock nginx.conf).

# WebSocket handshake: forward Upgrade, and send "Connection: upgrade" only
# when the client asked for it.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Access log with the replica that served each request.
log_format upstream '$remote_addr "$request" $status upstream=$upstream_addr rt=$request_time';

upstream web {
    zone web 64k;  # fail counters shared by all nginx workers
    # No balancing directive = round robin.
    # `web` is resolved once at startup via Docker DNS into one peer per replica.
    # After `--scale` or recreating web run `docker compose restart nginx`.
    # A stopped-then-started replica keeps its IP and rejoins on its own. `resolve` (dynamic re-resolution) was tried and dropped:
    # a retry racing with the peer-list refresh occasionally returned 502.
    # Passive health checks (active ones are nginx Plus only): one failed
    # attempt takes a replica out of rotation for 10s, then nginx tries it again.
    server web:8000 max_fails=1 fail_timeout=10s;
}

server {
    listen 80;
    access_log /var/log/nginx/access.log upstream;

    # A dead replica refuses/hangs the connection or answers 502-504: retry the
    # request on the next replica so the client never sees the failure.
    # POST/PATCH aren't retried (nginx default, no `non_idempotent`), so a bid
    # can't be placed twice.
    proxy_next_upstream error timeout http_502 http_503 http_504;
    proxy_next_upstream_tries 3;
    proxy_connect_timeout 1s;

    location / {
        proxy_pass http://web;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # proxy_set_header isn't inherited once a location sets its own, so the
    # common headers are repeated here.
    location /ws/ {
        proxy_pass http://web;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # An idle auction page keeps its socket open; default 60s would cut it.
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }
}
