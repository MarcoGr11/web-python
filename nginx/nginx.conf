# Mounted as /etc/nginx/conf.d/ (http context of the stock nginx.conf).

# Docker's embedded DNS. `web` resolves to one A record per running replica;
# `resolve` below re-queries it every `valid` seconds, so scaling up/down and
# stopped/started replicas are picked up without reloading nginx.
resolver 127.0.0.11 valid=5s ipv6=off;

# WebSocket handshake: forward Upgrade, and send "Connection: upgrade" only
# when the client asked for it.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Access log with the replica that served each request.
log_format upstream '$remote_addr "$request" $status upstream=$upstream_addr rt=$request_time';

upstream web {
    zone web 64k;  # shared memory, required by `resolve`
    # No balancing directive = round robin.
    server web:8000 resolve;
}

server {
    listen 80;
    access_log /var/log/nginx/access.log upstream;

    location / {
        proxy_pass http://web;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # proxy_set_header isn't inherited once a location sets its own, so the
    # common headers are repeated here.
    location /ws/ {
        proxy_pass http://web;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # An idle auction page keeps its socket open; default 60s would cut it.
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }
}
